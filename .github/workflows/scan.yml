name: PS5 hourly live retailer scan
on:
  schedule:
    - cron: '32 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: ps5-hourly-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax before executing
        run: |
          node --check src/publish.mjs
          node --check src/scan.mjs
          node --check src/discovery.mjs
          node --check src/alerts/state.mjs
          node --check src/probes/gamestop.mjs
          node --check src/evidence/cart.mjs
          node --check src/probes/gamestop-pickup.mjs
          node --check src/probes/gamestop-controls.mjs
          node --check src/probes/playstation-direct.mjs
          node --check src/probes/playstation-direct-cart.mjs
          node --check src/evidence/sony-price.mjs
          node --check src/evidence/url.mjs
          node --check src/checkout/cart-controls.mjs
          node --check src/checkout/evidence-checks.mjs
          node --check src/probes/product-controls.mjs
          node --check src/checkout/origin.mjs
          node --check src/probes/target-price.mjs
          node --check src/alerts/issue.mjs
          node --check scripts/simulate-offers.mjs
          node --check src/coverage.mjs
          node --check src/audit-history.mjs
          node --check src/evidence/product.mjs
      - name: Unit tests
        run: npm test
      - name: Install pinned Playwright
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Scan live retailer pages (zero-spend; fail closed)
        run: npm run scan
      - name: Restore durable alert history (fail if missing)
        run: |
          git fetch --no-tags origin audit
          git show origin/audit:evidence/alert-state.json > out/previous-alert-state.json
      - name: Open GitHub issue ONLY for fully verified deals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish
      - name: Save audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps5-scan-evidence
          path: out/
          retention-days: 7
      - name: Publish non-alerting audit and seven-day coverage history
        if: always()
        run: bash scripts/save-audit.sh
