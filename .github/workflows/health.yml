name: PS5 free CI safety tests
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ps5-ci-health-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax before executing
        run: |
          node --check src/publish.mjs
          node --check src/scan.mjs
          node --check src/discovery.mjs
          node --check src/alerts/state.mjs
          node --check src/probes/gamestop.mjs
          node --check src/evidence/cart.mjs
          node --check src/probes/gamestop-pickup.mjs
          node --check src/probes/gamestop-controls.mjs
          node --check src/probes/playstation-direct.mjs
          node --check src/probes/playstation-direct-cart.mjs
          node --check src/evidence/sony-price.mjs
          node --check src/evidence/url.mjs
          node --check src/checkout/cart-controls.mjs
          node --check src/checkout/evidence-checks.mjs
          node --check src/probes/product-controls.mjs
          node --check src/checkout/origin.mjs
          node --check src/alerts/issue.mjs
          node --check scripts/simulate-offers.mjs
          node --check src/coverage.mjs
          node --check src/audit-history.mjs
          node --check src/evidence/product.mjs
      - name: Run safety regression tests without paid services
        run: node --test
      - name: Run fictional checkout and notification dry-run (zero network)
        run: node scripts/simulate-offers.mjs
      - name: Record completed test run on ci-health branch
        if: success()
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN: ${{ github.run_id }}
        run: |
          git fetch origin ci-health
          git switch -C ci-health origin/ci-health
          mkdir -p evidence
          printf '{"source_commit":"%s","workflow_run":"%s","result":"unit-tests-passed","verified_live_checkout":false}\n' "$SOURCE_SHA" "$SOURCE_RUN" > evidence/ci-health.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/ci-health.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: record successful safety tests [skip ci]"
            git push origin ci-health
          fi
